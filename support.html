  <label>Nombre</label><input id="sName" class="input">
  <label>Email</label><input id="sEmail" class="input" type="email">
  <label>Mensaje</label><textarea id="sMsg" class="input" rows="4"></textarea>
  <button id="sSend" class="btn">Enviar</button>
  <p class="small">reCAPTCHA se activará cuando compartas la Site Key.</p>
</section>
<script>
document.getElementById('sSend').onclick=()=>{
  const n=sName.value.trim(), e=sEmail.value.trim(), m=sMsg.value.trim();
  if(!(n&&e&&m)){ toast("Completa el formulario", true); return; }
  const msgs=S.get("tq_support_msgs",[]); msgs.unshift({t:new Date().toLocaleString(), n, e, m}); S.set("tq_support_msgs",msgs); toast("Mensaje enviado (demo)"); sName.value=sEmail.value=sMsg.value="";
};
</script>
